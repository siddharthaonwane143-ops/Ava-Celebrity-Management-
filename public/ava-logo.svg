<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CA"/>
      <stop offset="25%" stop-color="#E5C266"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8F6306"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="45%" stop-color="#FFF8D6"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996D09"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050507" />

  <!-- Primary AVA Wordmark -->
  <g text-anchor="middle" id="logoGroup">
    <text x="400" y="270"
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif"
          font-size="190"
          font-weight="700"
          letter-spacing="4"
          fill="url(#goldMetallic)"
          filter="url(#goldGlow)"
          style="text-transform: uppercase;">
      AVA
    </text>

    <!-- Subtitle: CELEBRITY MANAGEMENT -->
    <text x="400" y="340"
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif"
          font-size="28"
          font-weight="600"
          letter-spacing="14"
          fill="url(#goldSheen)"
          style="text-transform: uppercase;">
      CELEBRITY MANAGEMENT
    </text>
  </g>
</svg>
